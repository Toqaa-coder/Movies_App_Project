<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Profiles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #141414;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .container { margin-top: 100px; }
        .title { font-size: 60px; margin-bottom: 40px; }
        .profiles {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .profile {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-avatar {
            width: 160px;
            height: 160px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: white;
            transition: 0.3s;
        }
        .profile-avatar:hover {
            transform: scale(1.1);
            border: 3px solid white;
        }
        .profile-avatar-img {
            width: 160px;
            height: 160px;
            border-radius: 10px;
            object-fit: cover;
            transition: 0.3s;
            cursor: pointer;
        }
        .profile-avatar-img:hover {
            transform: scale(1.1);
            border: 3px solid white;
        }
        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e50914;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            opacity: 0;
            transition: 0.2s;
        }
        .profile:hover .delete-btn {
            opacity: 1;
        }
        .profile p {
            margin-top: 10px;
            color: gray;
            font-size: 16px;
        }
        .manage-btn {
            margin-top: 50px;
            background: transparent;
            border: 1px solid gray;
            color: gray;
            padding: 10px 25px;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .manage-btn:hover { color: white; border-color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title">מי צופה?</h1>

    <div class="profiles" id="profiles-container"></div>

    <div class="mt-5" style="display: flex; justify-content: center; gap: 20px;">
        <button onclick="showAddProfileModal()" class="manage-btn">+ הוסף פרופיל חדש</button>
        <button onclick="logout()" class="manage-btn">יציאה</button>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="addProfileModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header">
                <h5 class="modal-title">פרופיל חדש</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="newProfileName" class="form-control bg-dark text-white" placeholder="שם הפרופיל" maxlength="25">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ביטול</button>
                <button type="button" class="btn btn-danger" onclick="addNewProfile()">יצירה</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="authClient.js"></script>
<script src="profiles.js"></script>
</body>
</html>
