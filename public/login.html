<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Netflix – התחברות</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #141414;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: rgba(0,0,0,0.75);
            border-radius: 8px;
            padding: 60px 68px;
            width: 400px;
        }

        .logo {
            color: #e50914;
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus { background: #454545; }

        button {
            width: 100%;
            padding: 14px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        button:hover { background: #c40812; }

        #error-msg {
            color: #e87c03;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo">NETFLIX</div>
    <h2>התחברות</h2>

    <input type="text"     id="username" placeholder="שם משתמש (אימייל)">
    <input type="password" id="password" placeholder="סיסמא">

    <button onclick="doLogin()">כניסה</button>

    <div id="error-msg"></div>
</div>

<!-- authClient.js חייב להיטען לפני ה-script הזה, כדי ש-saveAuth תהיה מוכרת -->
<script src="authClient.js"></script>

<script>
async function doLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorEl = document.getElementById("error-msg");

    if (!username || !password) {
        errorEl.textContent = "נא למלא שם משתמש וסיסמא";
        return;
    }

    try {
        const response = await fetch("/api/users/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            // השרת מצפה לשדה email, לכן שולחים את מה שהוקלד תחת המפתח email
            body: JSON.stringify({ email: username, password })
        });

        const data = await response.json();

        if (response.ok && data.token) {
            // שמירת הטוקן ופרטי המשתמש בעזרת authClient.js
            saveAuth(data.token, data.user);
            window.location.href = "/profiles.html";
        } else {
            errorEl.textContent = data.message || "שם משתמש או סיסמא שגויים";
        }
    } catch (error) {
        errorEl.textContent = "שגיאה בהתחברות לשרת";
    }
}

document.addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
});
</script>

</body>
</html>
