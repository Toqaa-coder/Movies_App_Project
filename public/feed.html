<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Project - Aya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="feed.css">
    <link rel="stylesheet" href="Movies.css">
</head>
<body>
    <nav class="navbar" id="mainNav">
        <div class="navbar-left">
            <a href="#" class="netflix-logo">NETFLIX</a>
            <ul class="nav-links">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">TV Shows</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">Games</a></li>
                <li><a href="#">New & Popular</a></li>
                <li><a href="#">My List</a></li>
                <li><a href="#">Browse by Languages</a></li>
            </ul>
        </div>
        
        <div class="navbar-right">
            <div class="nav-search-container">
                <div class="nav-search-box open">
                    <input type="text" id="searchInput" placeholder="Titles, people, genres" onkeyup="filterMovies()">
                </div>
                <button class="nav-search-icon">🔍</button>
            </div>
            <button class="alpha-btn" onclick="sortAlphabetically()">A-Z</button>
            <div class="nav-avatar">A</div>
        </div>
    </nav>

    <div id="hero">
        <div class="hero-content">
            <h1 id="hero-title" class="hero-title"></h1>
            <div id="hero-meta" class="hero-meta"></div>
            <div class="hero-buttons">
                <button class="btn-play">▶ Play</button>
                <button class="btn-info">ⓘ More Info</button>
            </div>
        </div>
        <button class="hero-arrow left" onclick="prevHero()">‹</button>
        <button class="hero-arrow right" onclick="nextHero()">›</button>
        <div id="hero-dots" class="hero-dots"></div>
    </div>

    <div class="feed-section">
        <h2 class="section-title">Trending Now</h2>
        <div class="row-wrapper">
            <button class="scroll-btn left" onclick="scrollRow('row-trending', -300)">‹</button>
            <div id="row-trending" class="row-row"></div>
            <button class="scroll-btn right" onclick="scrollRow('row-trending', 300)">›</button>
        </div>
    </div>

    <div class="feed-section">
        <h2 class="section-title">Reality TV</h2>
        <div class="row-wrapper">
            <button class="scroll-btn left" onclick="scrollRow('row-reality', -300)">‹</button>
            <div id="row-reality" class="row-row"></div>
            <button class="scroll-btn right" onclick="scrollRow('row-reality', 300)">›</button>
        </div>
    </div>

    <div class="feed-section">
        <h2 class="section-title">Continue Watching</h2>
        <div class="row-wrapper">
            <button class="scroll-btn left" onclick="scrollRow('row-continue', -300)">‹</button>
            <div id="row-continue" class="row-row"></div>
            <button class="scroll-btn right" onclick="scrollRow('row-continue', 300)">›</button>
        </div>
    </div>

    <script src="feed.js"></script>
</body>
</html>
