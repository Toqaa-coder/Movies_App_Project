<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies Charts</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { background: #141414; color: white; font-family: Arial; margin: 0; }
        #navbar { background: #141414; padding: 15px 20px; border-bottom: 1px solid #333; }
        .netflix-logo { color: #e50914; font-size: 24px; font-weight: 900; text-decoration: none; }
        .chart-container { padding: 30px; }
        h2 { color: #e50914; margin-bottom: 20px; }
        .bar { fill: #e50914; transition: 0.3s; }
        .bar:hover { fill: #ff6b6b; }
        .axis text { fill: white; font-size: 12px; }
        .axis path, .axis line { stroke: #555; }
        svg { background: #1e1e1e; border-radius: 10px; padding: 10px; }
        .arc:hover { opacity: 0.8; }
        .legend { font-size: 13px; }
    </style>
</head>
<body>
    <div id="navbar">
        <a href="feed.html" class="netflix-logo">NETFLIX</a>
        <span style="color:white; margin-left:20px;">📊 Movies Statistics</span>
    </div>

    <div class="chart-container">
        <h2>Movies by Genre</h2>
        <div id="bar-chart"></div>

        <h2 style="margin-top:40px;">Movies vs Series</h2>
        <div id="pie-chart"></div>
    </div>

    <script>
    async function loadCharts() {
        const response = await fetch('/api/posts');
        const posts = await response.json();

        // ── BAR CHART ──
        const genreCount = {};
        posts.forEach(p => {
            if (p.genre) genreCount[p.genre] = (genreCount[p.genre] || 0) + 1;
        });
        const genreData = Object.entries(genreCount).map(([genre, count]) => ({ genre, count }));

        const margin = { top: 20, right: 20, bottom: 60, left: 40 };
        const width = 600 - margin.left - margin.right;
        const height = 300 - margin.top - margin.bottom;

        const svgBar = d3.select("#bar-chart").append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const x = d3.scaleBand().domain(genreData.map(d => d.genre)).range([0, width]).padding(0.3);
        const y = d3.scaleLinear().domain([0, d3.max(genreData, d => d.count)]).range([height, 0]);

        svgBar.append("g").attr("class", "axis").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x))
            .selectAll("text").attr("transform", "rotate(-30)").style("text-anchor", "end").style("fill", "white");

        svgBar.append("g").attr("class", "axis").call(d3.axisLeft(y).ticks(5));

        svgBar.selectAll(".bar").data(genreData).enter().append("rect")
            .attr("class", "bar")
            .attr("x", d => x(d.genre))
            .attr("y", d => y(d.count))
            .attr("width", x.bandwidth())
            .attr("height", d => height - y(d.count));

        // ── PIE CHART ──
        const typeCount = {};
        posts.forEach(p => {
            if (p.type) typeCount[p.type] = (typeCount[p.type] || 0) + 1;
        });
        const pieData = Object.entries(typeCount).map(([type, count]) => ({ type, count }));
        const colors = ["#e50914", "#0071eb", "#2ecc71", "#f39c12"];

        const pieWidth = 400, pieHeight = 300, radius = 120;

        const svgPie = d3.select("#pie-chart").append("svg")
            .attr("width", pieWidth).attr("height", pieHeight)
            .append("g").attr("transform", `translate(150,150)`);

        const pie = d3.pie().value(d => d.count);
        const arc = d3.arc().innerRadius(0).outerRadius(radius);

        svgPie.selectAll(".arc").data(pie(pieData)).enter().append("path")
            .attr("class", "arc")
            .attr("d", arc)
            .attr("fill", (d, i) => colors[i]);

        // Legend
        const legend = d3.select("#pie-chart").select("svg").append("g").attr("transform", "translate(290,80)");
        pieData.forEach((d, i) => {
            legend.append("rect").attr("x", 0).attr("y", i * 25).attr("width", 15).attr("height", 15).attr("fill", colors[i]);
            legend.append("text").attr("class", "legend").attr("x", 20).attr("y", i * 25 + 12).attr("fill", "white").text(`${d.type}: ${d.count}`);
        });
    }

    loadCharts();
    </script>
</body>
</html>
