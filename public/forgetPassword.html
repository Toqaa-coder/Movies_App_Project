<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Netflix – שחזור סיסמה</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
                        url('images/background.jpg') center/cover no-repeat;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: rgba(0,0,0,0.75);
            border-radius: 4px;
            padding: 60px 68px;
            width: 400px;
        }

        h2 { font-size: 26px; margin-bottom: 20px; }
        p { color: #b3b3b3; font-size: 13px; margin-bottom: 16px; }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #c40812; }

        .hidden { display: none; }

        #msg {
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }
        .error { color: #e87c03; }
        .success { color: #2ecc71; }

        a.link {
            display: block;
            margin-top: 16px;
            text-align: center;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 13px;
        }
        a.link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="box">

    <!-- שלב 1: הזנת אימייל -->
    <div id="step-email">
        <h2>שחזור סיסמה</h2>
        <p>נשלח לך קוד לאימייל שלך</p>
        <input type="text" id="email" placeholder="אימייל">
        <button onclick="sendCode()">שלחו קוד</button>
    </div>

    <!-- שלב 2: קוד + סיסמה חדשה -->
    <div id="step-reset" class="hidden">
        <h2>איפוס סיסמה</h2>
        <p>הזני את הקוד שקיבלת, ואת הסיסמה החדשה</p>
        <input type="text" id="code" placeholder="קוד בן 6 ספרות">
        <input type="password" id="newPassword" placeholder="סיסמה חדשה">
        <button onclick="resetPassword()">איפוס סיסמה</button>
    </div>

    <div id="msg"></div>
    <a href="login.html" class="link">חזרה להתחברות</a>
</div>

<script>
let userEmail = '';

async function sendCode() {
    const email = document.getElementById("email").value.trim();
    const msgEl = document.getElementById("msg");

    if (!email) {
        msgEl.className = 'error';
        msgEl.textContent = "נא למלא אימייל";
        return;
    }

    try {
        const response = await fetch("/api/users/send-code", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });
        const data = await response.json();

        if (response.ok) {
            userEmail = email;
            document.getElementById('step-email').classList.add('hidden');
            document.getElementById('step-reset').classList.remove('hidden');
            msgEl.className = 'success';
            msgEl.textContent = data.message;
        } else {
            msgEl.className = 'error';
            msgEl.textContent = data.message || "שגיאה בשליחת קוד";
        }
    } catch (error) {
        msgEl.className = 'error';
        msgEl.textContent = "שגיאה בהתחברות לשרת";
    }
}

async function resetPassword() {
    const code = document.getElementById("code").value.trim();
    const newPassword = document.getElementById("newPassword").value.trim();
    const msgEl = document.getElementById("msg");

    if (!code || !newPassword) {
        msgEl.className = 'error';
        msgEl.textContent = "נא למלא קוד וסיסמה חדשה";
        return;
    }

    try {
        const response = await fetch("/api/users/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail, code, newPassword })
        });
        const data = await response.json();

        if (response.ok) {
            msgEl.className = 'success';
            msgEl.textContent = "הסיסמה עודכנה! מעבירים אותך להתחברות...";
            setTimeout(() => window.location.href = "login.html", 2000);
        } else {
            msgEl.className = 'error';
            msgEl.textContent = data.message || "קוד שגוי או פג תוקף";
        }
    } catch (error) {
        msgEl.className = 'error';
        msgEl.textContent = "שגיאה בהתחברות לשרת";
    }
}
</script>

</body>
</html>
