<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Main Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="const movies.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix">
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link fw-bold" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">TV Shows</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Movies</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Games</a></li>
                <li class="nav-item"><a class="nav-link" href="#">New &amp; Popular</a></li>
                <li class="nav-item"><a class="nav-link" href="#">My List</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Browse by Languages</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">

                <!-- Search icon -->
                <a href="#" class="icon-link" id="search-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                    </svg>
                </a>

                <!-- Bell icon -->
                <a href="#" class="icon-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 16 16">
                        <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zm.995-14.901a1 1 0 1 0-1.99 0A5.002 5.002 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901z"/>
                    </svg>
                </a>

                <!-- Profile -->
                <div class="d-flex align-items-center" style="cursor:pointer;">
                    <img
                        src="https://i.pravatar.cc/150?img=47"
                        alt="Profile"
                        class="profile-img"
                        id="profile-pic"
                        onerror="this.onerror=null;this.style.display='none';document.getElementById('profile-fallback').style.display='flex';"
                    >
                    <div id="profile-fallback"
                         style="display:none;width:36px;height:36px;border-radius:6px;
                                background:#e50914;align-items:center;justify-content:center;
                                font-size:15px;font-weight:bold;margin-left:4px;">W</div>
                    <span style="font-size:10px;margin-left:5px;color:white;text-shadow:0 1px 3px #000;">▼</span>
                </div>

            </div>
        </div>
    </div>
</nav>
<!-- ====================== בחירת פרופילים ====================== -->
<div class="container mt-5" id="profiles-section">
    <h1 class="text-center mb-5" style="color: white;">מי צופה?</h1>
    
    <div class="row justify-content-center" id="profiles-container">
        <!-- הפרופילים ייטענו כאן -->
    </div>

    <div class="text-center mt-5">
        <button onclick="showAddProfileModal()" class="btn btn-outline-light btn-lg px-5">
            + הוסף פרופיל חדש
        </button>
    </div>
</div>

<br><br><hr style="border-color:#333"><br>
<!-- Search bar -->
<div id="search-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="gray" viewBox="0 0 16 16">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
    </svg>
    <input type="text" id="search" class="form-control" placeholder="Search titles...">
</div>

<!-- Search results -->
<div id="search-results"></div>

<!-- Not found -->
<div id="not-found">
    <div class="nf-icon">🎬</div>
    <h4>Title Not Available</h4>
    <p>This title is not available on our platform.<br>Try searching for something else.</p>
</div>

<!-- Main content -->
<div id="main-content">

    <h5 class="section-title">TV Dramas</h5>
    <div class="row-outer">
        <button class="slider-arrow left"  id="drama-left"  onclick="scrollRow('drama',-1)">&#8249;</button>
        <div class="row-track" id="dramas-track"></div>
        <button class="slider-arrow right" id="drama-right" onclick="scrollRow('drama', 1)">&#8250;</button>
    </div>

    <h5 class="section-title" style="margin-top:30px;">Top 10 TV Shows Today</h5>
    <div class="row-outer">
        <button class="slider-arrow left"  id="movie-left"  onclick="scrollRow('movie',-1)">&#8249;</button>
        <div class="row-track" id="catalog-track"></div>
        <button class="slider-arrow right" id="movie-right" onclick="scrollRow('movie', 1)">&#8250;</button>
    </div>

</div>
<!-- ====================== Modal להוספת פרופיל ====================== -->
<div class="modal fade" id="addProfileModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header">
                <h5 class="modal-title">פרופיל חדש</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="newProfileName" class="form-control bg-dark text-white" placeholder="שם הפרופיל" maxlength="25">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ביטול</button>
                <button type="button" class="btn btn-danger" onclick="addNewProfile()">יצירה</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="menu.js"></script>
<script src="js/profiles.js"></script>
</body>
</html>
