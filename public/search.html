<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Search & Filter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #141414; color: white; font-family: Arial; margin: 0; }
        #navbar { background: #141414; padding: 15px 20px; border-bottom: 1px solid #333; }
        .netflix-logo { color: #e50914; font-size: 24px; font-weight: 900; text-decoration: none; }
        .search-section { padding: 30px; }
        h2 { color: #e50914; }
        input, select { background: #333 !important; color: white !important; border: 1px solid #555 !important; }
        input::placeholder { color: #aaa; }
        .movie-card { background: #222; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .movie-card img { width: 100%; height: 150px; object-fit: cover; }
        .movie-card .info { padding: 10px; }
        .movie-card .title { font-weight: bold; font-size: 14px; }
        .movie-card .meta { color: #aaa; font-size: 12px; }
        .badge-genre { background: #e50914; color: white; padding: 3px 8px; border-radius: 10px; font-size: 11px; }
        .group-section { background: #222; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .group-title { color: #e50914; font-weight: bold; }
        #no-results { color: #aaa; text-align: center; padding: 40px; display: none; }
    </style>
</head>
<body>
    <div id="navbar">
        <a href="feed.html" class="netflix-logo">NETFLIX</a>
        <span style="color:white; margin-left:20px;">🔍 Search & Filter</span>
    </div>

    <div class="search-section">
        <!-- Search & Filter -->
        <h2>Search & Filter</h2>
        <div class="row mb-4">
            <div class="col-md-4 mb-2">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by title...">
            </div>
            <div class="col-md-3 mb-2">
                <select id="genreFilter" class="form-select">
                    <option value="">All Genres</option>
                    <option>Fantasy</option>
                    <option>Drama</option>
                    <option>Crime</option>
                    <option>Action</option>
                    <option>Thriller</option>
                    <option>Sci-Fi</option>
                    <option>Reality</option>
                    <option>Comedy</option>
                    <option>Romance</option>
                </select>
            </div>
            <div class="col-md-3 mb-2">
                <select id="typeFilter" class="form-select">
                    <option value="">All Types</option>
                    <option>Movie</option>
                    <option>Series</option>
                </select>
            </div>
            <div class="col-md-2 mb-2">
                <button class="btn btn-danger w-100" onclick="doSearch()">Search</button>
            </div>
        </div>

        <!-- Results -->
        <div id="no-results">No results found 😕</div>
        <div class="row" id="results"></div>

        <!-- GroupBy Section -->
        <h2 class="mt-5">📊 Group By Genre</h2>
        <div id="groupby"></div>
    </div>

    <script>
    let allPosts = [];

    async function loadData() {
        const res = await fetch('/api/posts');
        allPosts = await res.json();
        doSearch();
        renderGroupBy();
    }

    function doSearch() {
        const title = document.getElementById('searchInput').value.toLowerCase();
        const genre = document.getElementById('genreFilter').value;
        const type = document.getElementById('typeFilter').value;

        let filtered = allPosts.filter(p => {
            const matchTitle = p.title.toLowerCase().includes(title);
            const matchGenre = genre ? p.genre === genre : true;
            const matchType = type ? p.type === type : true;
            return matchTitle && matchGenre && matchType;
        });

        renderResults(filtered);
    }

    function renderResults(items) {
        const container = document.getElementById('results');
        const noResults = document.getElementById('no-results');
        container.innerHTML = '';

        if (items.length === 0) {
            noResults.style.display = 'block';
            return;
        }
        noResults.style.display = 'none';

        items.forEach(item => {
            container.innerHTML += `
                <div class="col-md-2 col-sm-4 col-6">
                    <div class="movie-card">
                        <img src="${item.img}" alt="${item.title}">
                        <div class="info">
                            <div class="title">${item.title}</div>
                            <div class="meta">${item.year} • <span class="badge-genre">${item.genre}</span></div>
                            <div class="meta mt-1">${item.type || ''}</div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function renderGroupBy() {
        const groupby = document.getElementById('groupby');
        const groups = {};
        allPosts.forEach(p => {
            if (p.genre) groups[p.genre] = (groups[p.genre] || []);
            groups[p.genre].push(p.title);
        });

        groupby.innerHTML = '';
        Object.entries(groups).forEach(([genre, titles]) => {
            groupby.innerHTML += `
                <div class="group-section">
                    <div class="group-title">${genre} (${titles.length})</div>
                    <div style="color:#ccc; font-size:13px; margin-top:5px;">${titles.join(', ')}</div>
                </div>`;
        });
    }

    document.getElementById('searchInput').addEventListener('input', doSearch);
    document.getElementById('genreFilter').addEventListener('change', doSearch);
    document.getElementById('typeFilter').addEventListener('change', doSearch);

    loadData();
    </script>
</body>
</html>
