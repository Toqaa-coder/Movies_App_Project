<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Israel - כניסה</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://assets.nflxext.com/ffe/siteui/common/icons/nficon2016.ico">
</head>
<body>

    <div id="intro-screen">
        <h1 class="netflix-intro-text">NETFLIX</h1>
    </div>

    <div class="netflix-bg">
        <div class="overlay-dark"></div>
    </div>

    <header class="top-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix" class="nf-logo">
    </header>

    <main class="login-container">
        <div class="login-card">
            <h1>כניסה</h1>

            <div class="input-wrapper">
                <input type="text" id="username" placeholder="שם משתמש">
            </div>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="סיסמה">
            </div>

            <button class="login-btn" onclick="doLogin()">כניסה</button>

            <div class="or-separator">או</div>
            <button type="button" class="code-btn">שימוש בקוד כניסה</button>

            <div class="forgot-password">
                <a href="#">שכחת את הסיסמה?</a>
            </div>

            <div class="extra-options">
                <label class="check-container">
                    <input type="checkbox" checked>
                    <span>זכור אותי</span>
                </label>
            </div>

            <div id="error-msg" style="color:#e87c03;font-size:13px;margin-top:12px;text-align:center;min-height:20px;"></div>

            <div class="login-footer">
                <div class="signup-text">
                    חדש ב-Netflix? <a href="#">הרשמה עכשיו.</a>
                </div>
                <div class="recaptcha-text">
                    הדף מוגן באמצעות reCAPTCHA של Google. <a href="#">פרטים נוספים.</a>
                </div>
            </div>
        </div>
    </main>

<script>
// אם כבר מחובר עבור לפרופילים
const existingToken = localStorage.getItem('token');
if (existingToken) {
    fetch('/api/session-check', { headers: { 'x-auth-token': existingToken } })
        .then(r => r.json())
        .then(data => { if (data.valid) window.location.href = '/profiles.html'; });
}

async function doLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorEl  = document.getElementById("error-msg");

    // Client-side validation
    if (!username || !password) {
        errorEl.textContent = "נא למלא שם משתמש וסיסמה";
        return;
    }
    if (username.length < 2) {
        errorEl.textContent = "שם משתמש חייב להכיל לפחות 2 תווים";
        return;
    }
    if (password.length < 4) {
        errorEl.textContent = "סיסמה חייבת להכיל לפחות 4 תווים";
        return;
    }

    const response = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (data.success) {
        localStorage.setItem('token', data.token);
        window.location.href = '/profiles.html';
    } else {
        errorEl.textContent = data.message;
    }
}

document.addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
});
</script>
</body>
</html>
