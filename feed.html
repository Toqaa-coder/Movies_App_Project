<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="feed.css">
</head>
<body>


    <div id="hero">

    <div class="hero-content">
        <h1 class="hero-title" id="hero-title"></h1>

        <div class="hero-meta">
            <span class="hero-badge"></span>
            <span id="hero-meta"></span>
        </div>

        <div class="hero-buttons">
            <button class="btn-play">▶️ Play</button>
            <button class="btn-info">ℹ More Info</button>
        </div>
    </div>

    <!--  LEFT ARROW -->
    <button class="hero-arrow left" onclick="prevHero()">‹</button>

    <!--  RIGHT ARROW -->
    <button class="hero-arrow right" onclick="nextHero()">›</button>

    <!--  DOTS -->
    <div id="hero-dots" class="hero-dots"></div>

</div>

   
    <div id="hero-ad" class="hero-ad hidden">
        <h2 id="ad-title"></h2>
        <p id="ad-desc"></p>
    </div>
    </div>
    </div>

    <!-- ROW 1 -->
<div class="feed-section">
    <h2 class="section-title">Trending Now</h2>

    <div class="row-wrapper">
        <button class="scroll-btn left" onclick="scrollRow('row-trending', -300)">‹</button>
        <div id="row-trending" class="row-row"></div>
        <button class="scroll-btn right" onclick="scrollRow('row-trending', 300)">›</button>
    </div>
</div>

<!-- ROW 2 -->
<div class="feed-section">
    <h2 class="section-title">Reality TV</h2>

    <div class="row-wrapper">
        <button class="scroll-btn left" onclick="scrollRow('row-reality', -300)">‹</button>
        <div id="row-reality" class="row-row"></div>
        <button class="scroll-btn right" onclick="scrollRow('row-reality', 300)">›</button>
    </div>
</div>

<!-- ROW 3 -->
<div class="feed-section">
    <h2 class="section-title">Continue Watching</h2>

    <div class="row-wrapper">
        <button class="scroll-btn left" onclick="scrollRow('row-continue', -300)">‹</button>
        <div id="row-continue" class="row-row"></div>
        <button class="scroll-btn right" onclick="scrollRow('row-continue', 300)">›</button>
    </div>
</div>
  <script src="feed.js"></script>  
</body>
</html>
